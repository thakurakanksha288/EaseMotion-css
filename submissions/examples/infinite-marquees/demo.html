<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS-Only Infinite Marquee Ticker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <h1>CSS-Only Infinite Marquee</h1>
    <p>A performant, GPU-accelerated ticker with pause-on-hover and reduced-motion support.</p>

    <div class="marquee-wrapper" aria-label="Our Tech Stack Partners">
      <div class="marquee-track">
        
        <div class="marquee-group" aria-hidden="false">
          <div class="marquee-card">⚡ HTML5</div>
          <div class="marquee-card">🎨 CSS3</div>
          <div class="marquee-card">🚀 JavaScript</div>
          <div class="marquee-card">⚛️ React</div>
          <div class="marquee-card">🟢 Node.js</div>
          <div class="marquee-card">🛢️ MongoDB</div>
          <div class="marquee-card">🦊 Git</div>
          <div class="marquee-card">🐳 Docker</div>
        </div>

        <div class="marquee-group" aria-hidden="true">
          <div class="marquee-card">⚡ HTML5</div>
          <div class="marquee-card">🎨 CSS3</div>
          <div class="marquee-card">🚀 JavaScript</div>
          <div class="marquee-card">⚛️ React</div>
          <div class="marquee-card">🟢 Node.js</div>
          <div class="marquee-card">🛢️ MongoDB</div>
          <div class="marquee-card">🦊 Git</div>
          <div class="marquee-card">🐳 Docker</div>
        </div>

      </div>
    </div>
  </main>

</body>
</html>
