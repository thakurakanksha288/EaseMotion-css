<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EaseMotion CSS — Scroll-Driven Animations</title>
<link rel="stylesheet" href="style.css">
<style>
  body { font-family: system-ui, sans-serif; margin: 0; }
  .em-progress-bar {
    position: fixed; top: 0; left: 0; height: 6px; width: 100%;
    background: linear-gradient(90deg, #6366f1, #ec4899);
    z-index: 100;
  }
  section { height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card {
    width: 280px; padding: 32px; border-radius: 16px;
    background: #1e1e2e; color: #fff; text-align: center;
  }
</style>
</head>
<body>

  <div class="em-progress-bar em-scroll-timeline"></div>

  <section><h1>Scroll down ↓</h1></section>

  <section>
    <div class="em-fade-in em-scale-up em-scroll-view card">
      <h2>I fade & scale in</h2>
      <p>Powered by <code>animation-timeline: view()</code> — no JS.</p>
    </div>
  </section>

  <section>
    <div class="em-fade-in em-scale-up em-scroll-view card">
      <h2>So do I</h2>
    </div>
  </section>

</body>
</html>
